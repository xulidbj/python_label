<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF表单填充工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        @media (max-width: 992px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .form-section, .result-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
        }

        .section-title {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            font-size: 1.4em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            font-family: 'Consolas', 'Monaco', monospace;
            resize: vertical;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: #e9ecef;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover {
            background: #dee2e6;
        }

        .mode-btn.active:hover {
            background: #5a67d8;
        }

        .mode-description {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-content {
            background: white;
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid #28a745;
            overflow-y: auto;
        }

        .result-content.error {
            border-left-color: #dc3545;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .pdf-url {
            word-break: break-all;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            flex: 1;
        }

        .example {
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
        }

        .example code {
            display: block;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', monospace;
            margin-top: 10px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 6px;
            color: #0c5460;
            margin-bottom: 20px;
        }

        .info i {
            font-size: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toggle-example {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            padding: 5px;
            font-size: 14px;
            text-decoration: underline;
            float: right;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }

        .batch-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 6px;
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 14px;
            color: #856404;
        }

        .pdf-file-list {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background: white;
        }

        .pdf-file-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #e9ecef;
            background: #f8f9fa;
        }

        .pdf-file-item:last-child {
            border-bottom: none;
        }

        .pdf-file-item:hover {
            background: #e9ecef;
        }

        .pdf-file-index {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            margin-right: 10px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .pdf-file-name {
            flex: 1;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            color: #495057;
            word-break: break-all;
            white-space: normal;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #667eea;
            border-radius: 5px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .url-info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            color: #0c5460;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            color: #721c24;
        }

        /* 新增表格样式 */
        .data-table-container {
            margin-top: 10px;
            max-height: 400px;
            overflow: auto;
            border: 1px solid #e1e5e9;
            border-radius: 6px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .data-table th, .data-table td {
            border: 1px solid #e1e5e9;
            padding: 8px 12px;
            min-width: 120px;
        }

        .data-table th {
            background: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #e1e5e9;
            border-radius: 4px;
            font-size: 14px;
        }

        .table-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .table-actions button {
            padding: 8px 15px;
            font-size: 14px;
            width: auto;
            flex: none;
        }

        .json-preview {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            max-height: 150px;
            overflow: auto;
            border: 1px solid #e1e5e9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 PDF表单填充工具</h1>
            <p class="subtitle">智能识别PDF表单字段，自动填充数据并生成新PDF（支持中文和批量处理）</p>
        </header>

        <div class="content">
            <div class="form-section">
                <h2 class="section-title">
                    📝 填写表单参数
                </h2>

                <!-- PDF文件列表显示区域 -->
                <div class="form-group">
                    <label>PDF文件列表（从URL参数获取）</label>
                    <div class="url-info">
                        <p><strong>URL参数格式：</strong>?pdf_url=["URL1","URL2","URL3"]</p>
                        <p><strong>当前PDF数量：</strong> <span id="pdfCount">0</span> 个</p>
                    </div>
                    <div id="pdfListSection" style="display: none;">
                        <div class="pdf-file-list" id="pdfFileList"></div>
                        <small class="batch-info">这些PDF文件从URL参数自动加载，不可编辑</small>
                    </div>
                    <div id="pdfErrorSection" class="error-message" style="display: none;">
                        <strong>❌ 错误：</strong> <span id="pdfErrorMessage"></span>
                    </div>
                </div>

                <!-- 数据处理模式 -->
                <div class="form-group">
                    <label>数据处理模式</label>
                    <div class="mode-buttons" id="dataModeBtns">
                        <div class="mode-btn active" data-mode="single" onclick="setDataMode('single')">单份数据</div>
                        <div class="mode-btn" data-mode="multiple" onclick="setDataMode('multiple')">多份数据</div>
                        <div class="mode-btn" data-mode="match" onclick="setDataMode('match')">一对一匹配</div>
                    </div>

                    <div class="mode-description" id="dataModeDesc">
                        单份数据：所有PDF使用相同的数据
                    </div>
                </div>

                <!-- 替换JSON输入框为可编辑表格 -->
                <div class="form-group">
                    <label>
                        填充数据 *
                    </label>
                    <!-- 表格操作按钮 -->
                    <div class="table-actions">
                        <button type="button" onclick="addColumn()">➕ 新增列</button>
                        <button type="button" onclick="addRow()">➕ 新增行</button>
                        <button type="button" onclick="removeLastColumn()">➖ 删除最后一列</button>
                        <button type="button" onclick="removeLastRow()">➖ 删除最后一行</button>
                    </div>
                    <!-- 数据表格容器 -->
                    <div class="data-table-container">
                        <table class="data-table" id="dataTable">
                            <thead>
                                <tr>
                                    <th><input type="text" placeholder="字段名" value="PO_NO"></th>
                                    <th><input type="text" placeholder="字段名" value="CUSTOMER_NAME"></th>
                                    <th><input type="text" placeholder="字段名" value="DATE"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" placeholder="值" value="PO20240001"></td>
                                    <td><input type="text" placeholder="值" value="zhangsan"></td>
                                    <td><input type="text" placeholder="值" value="2024-01-15"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- JSON预览区域 -->
                    <div class="batch-info" style="margin-top: 10px;">
                        <strong>数据预览（JSON格式）：</strong>
                    </div>
                    <div class="json-preview" id="jsonPreview"></div>

                    <div class="example" id="exampleSection" style="display: none;">
                        <strong>数据格式说明：</strong>
                        <div id="exampleContent"></div>
                    </div>
                </div>

                <button type="button" id="submitBtn" disabled onclick="submitForm()">🚀 生成PDF</button>
                <div class="batch-info" id="submitInfo" style="margin-top: 10px; display: none;">
                    请先等待PDF文件加载完成
                </div>
            </div>

            <div class="result-section" id="resultSection">
                <h2 class="section-title">📊 处理结果</h2>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在处理PDF，请稍候...</p>
                    <div class="progress-bar">
                        <div class="progress" id="progressBar"></div>
                    </div>
                    <div class="progress-text" id="progressText">准备中...</div>
                </div>

                <div id="resultContent"></div>
            </div>
        </div>

        <footer>
            <p>PDF Form Filler API v2.0 | 支持中文替换和批量PDF处理</p>
        </footer>
    </div>

    <script>
        // 模式状态
        let dataMode = 'single'; // 'single', 'multiple', 'match'
        let pdfUrls = []; // 从URL参数获取的PDF列表

        // 示例数据
        const examples = {
            single: {
                json: `{
  "PO_NO": "PO20240001",
  "CUSTOMER_NAME": "zhangsan",
  "DATE": "2024-01-15",
  "AMOUNT": "10000.00",
  "DESCRIPTION": "caigou"
}`,
                description: "单份数据：所有PDF使用相同的替换数据"
            },
            multiple: {
                json: `[
  {
    "PO_NO": "PO20240001",
    "CUSTOMER_NAME": "zhangsan",
    "DATE": "2024-01-15",
    "AMOUNT": "10000.00"
  },
  {
    "PO_NO": "PO20240002",
    "CUSTOMER_NAME": "lisi",
    "DATE": "2024-01-16",
    "AMOUNT": "25000.00"
  }
]`,
                description: "多份数据：生成多个PDF，每份数据对应一个PDF"
            },
            match: {
                json: `[
  {
    "订单号": "PO20240001",
    "客户名称": "张三",
    "金额": "10000.00"
  },
  {
    "订单号": "PO20240002",
    "客户名称": "李四",
    "金额": "25000.00"
  }
]`,
                description: "一对一匹配：每个PDF对应一份数据（数据条数需与PDF数量相同）"
            }
        };

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化表格数据预览
            updateJsonPreview();
            // 监听表格输入变化，实时更新预览
            document.getElementById('dataTable').addEventListener('input', updateJsonPreview);

            // 从URL参数获取PDF列表
            loadPdfUrlsFromUrl();

            // 更新数据输入提示
            updateDataInput();
        });

        // 从URL参数获取PDF列表（支持单引号和双引号）
        function loadPdfUrlsFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const pdfUrlParam = urlParams.get('pdf_url');

            if (!pdfUrlParam) {
                showPdfError('URL参数中未找到pdf_url参数。请确保URL格式为：?pdf_url=["URL1","URL2"]');
                return;
            }

            try {
                // 处理单引号问题，替换为双引号后解析
                const normalizedParam = pdfUrlParam.replace(/'/g, '"');
                // 解析JSON数组
                pdfUrls = JSON.parse(normalizedParam);

                if (!Array.isArray(pdfUrls)) {
                    showPdfError('pdf_url参数必须是一个JSON数组，例如：["URL1","URL2"]');
                    return;
                }

                if (pdfUrls.length === 0) {
                    showPdfError('pdf_url参数中的数组为空，请至少提供一个PDF URL');
                    return;
                }

                // 验证每个URL
                const invalidUrls = [];
                pdfUrls = pdfUrls.filter(url => {
                    const trimmedUrl = url.trim();
                    if (!trimmedUrl.startsWith('http://') && !trimmedUrl.startsWith('https://')) {
                        invalidUrls.push(url);
                        return false;
                    }
                    return true;
                });

                if (pdfUrls.length === 0) {
                    showPdfError('所有PDF URL格式无效。URL必须以http://或https://开头');
                    return;
                }

                if (invalidUrls.length > 0) {
                    console.warn('以下URL格式无效，已被过滤:', invalidUrls);
                }

                // 显示PDF列表
                displayPdfList();

            } catch (error) {
                showPdfError('解析pdf_url参数失败：' + error.message);
                console.error('解析pdf_url参数失败:', error);
            }
        }

        // 显示PDF列表
        function displayPdfList() {
            const pdfListSection = document.getElementById('pdfListSection');
            const pdfFileList = document.getElementById('pdfFileList');
            const pdfCount = document.getElementById('pdfCount');
            const submitBtn = document.getElementById('submitBtn');
            const submitInfo = document.getElementById('submitInfo');

            // 更新数量
            pdfCount.textContent = pdfUrls.length;

            // 清空列表
            pdfFileList.innerHTML = '';

            // 添加PDF项目
            pdfUrls.forEach((url, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'pdf-file-item';

                // 提取文件名
                let fileName = url.split('/').pop() || `PDF_${index + 1}`;
                if (fileName.length > 50) {
                    fileName = fileName.substring(0, 50) + '...';
                }

                fileItem.innerHTML = `
                    <div class="pdf-file-index">${index + 1}</div>
                    <div class="pdf-file-name">
                        <div><strong>${fileName}</strong></div>
                        <div style="font-size: 12px; color: #6c757d; margin-top: 3px;">${url}</div>
                    </div>
                `;

                pdfFileList.appendChild(fileItem);
            });

            // 显示列表区域
            pdfListSection.style.display = 'block';

            // 启用提交按钮
            submitBtn.disabled = false;
            submitInfo.style.display = 'none';

            // 更新数据模式描述
            updateDataInput();
        }

        // 显示PDF错误
        function showPdfError(message) {
            const pdfErrorSection = document.getElementById('pdfErrorSection');
            const pdfErrorMessage = document.getElementById('pdfErrorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const submitInfo = document.getElementById('submitInfo');

            pdfErrorMessage.textContent = message;
            pdfErrorSection.style.display = 'block';

            // 禁用提交按钮
            submitBtn.disabled = true;
            submitInfo.style.display = 'block';
            submitInfo.innerHTML = `<strong>⚠️ 无法提交：</strong>${message}`;
        }

        // 设置数据模式
        function setDataMode(mode) {
            dataMode = mode;

            // 更新按钮状态
            document.querySelectorAll('#dataModeBtns .mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                }
            });

            // 根据模式初始化表格数据
            initTableByMode(mode);
            // 更新数据输入提示
            updateDataInput();
        }

        // 根据模式初始化表格数据
        function initTableByMode(mode) {
            const table = document.getElementById('dataTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');

            // 清空表格
            thead.innerHTML = '';
            tbody.innerHTML = '';

            // 解析示例数据
            const exampleData = JSON.parse(examples[mode].json);

            if (mode === 'single') {
                // 单份数据：对象 -> 一行多列
                const keys = Object.keys(exampleData);
                // 创建表头
                const headerRow = document.createElement('tr');
                keys.forEach(key => {
                    const th = document.createElement('th');
                    th.innerHTML = `<input type="text" placeholder="字段名" value="${key}">`;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);

                // 创建数据行
                const dataRow = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    td.innerHTML = `<input type="text" placeholder="值" value="${exampleData[key]}">`;
                    dataRow.appendChild(td);
                });
                tbody.appendChild(dataRow);
            } else {
                // 多份数据/一对一匹配：数组 -> 多行多列
                if (exampleData.length === 0) return;
                const keys = Object.keys(exampleData[0]);
                // 创建表头
                const headerRow = document.createElement('tr');
                keys.forEach(key => {
                    const th = document.createElement('th');
                    th.innerHTML = `<input type="text" placeholder="字段名" value="${key}">`;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);

                // 创建数据行
                exampleData.forEach(item => {
                    const dataRow = document.createElement('tr');
                    keys.forEach(key => {
                        const td = document.createElement('td');
                        td.innerHTML = `<input type="text" placeholder="值" value="${item[key] || ''}">`;
                        dataRow.appendChild(td);
                    });
                    tbody.appendChild(dataRow);
                });
            }

            // 更新预览
            updateJsonPreview();
        }

        // 更新数据输入提示
        function updateDataInput() {
            const desc = document.getElementById('dataModeDesc');
            desc.textContent = examples[dataMode].description;

            // 根据PDF数量更新描述
            const pdfCount = pdfUrls.length;
            if (pdfCount > 1) {
                if (dataMode === 'single') {
                    desc.textContent += ` (${pdfCount}个PDF使用相同数据)`;
                } else if (dataMode === 'match') {
                    desc.textContent += ` (需要${pdfCount}份数据)`;
                }
            }
        }

        // 新增列
        function addColumn() {
            const table = document.getElementById('dataTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');

            // 表头新增列
            const headerRows = thead.querySelectorAll('tr');
            headerRows.forEach(row => {
                const th = document.createElement('th');
                th.innerHTML = `<input type="text" placeholder="字段名">`;
                row.appendChild(th);
            });

            // 数据行新增列
            const dataRows = tbody.querySelectorAll('tr');
            dataRows.forEach(row => {
                const td = document.createElement('td');
                td.innerHTML = `<input type="text" placeholder="值">`;
                row.appendChild(td);
            });

            updateJsonPreview();
        }

        // 新增行
        function addRow() {
            const table = document.getElementById('dataTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            const headerRow = thead.querySelector('tr');
            const columnCount = headerRow ? headerRow.children.length : 0;

            if (columnCount === 0) return;

            // 新增数据行
            const dataRow = document.createElement('tr');
            for (let i = 0; i < columnCount; i++) {
                const td = document.createElement('td');
                td.innerHTML = `<input type="text" placeholder="值">`;
                dataRow.appendChild(td);
            }
            tbody.appendChild(dataRow);

            updateJsonPreview();
        }

        // 删除最后一列
        function removeLastColumn() {
            const table = document.getElementById('dataTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            const headerRow = thead.querySelector('tr');
            const dataRows = tbody.querySelectorAll('tr');

            if (headerRow && headerRow.children.length > 1) {
                // 删除表头最后一列
                headerRow.removeChild(headerRow.lastChild);
                // 删除数据行最后一列
                dataRows.forEach(row => {
                    if (row.children.length > 0) {
                        row.removeChild(row.lastChild);
                    }
                });
            } else {
                alert('至少保留一列数据！');
            }

            updateJsonPreview();
        }

        // 删除最后一行
        function removeLastRow() {
            const tbody = document.getElementById('dataTable').querySelector('tbody');
            const dataRows = tbody.querySelectorAll('tr');

            if (dataRows.length > 1) {
                tbody.removeChild(tbody.lastChild);
            } else {
                alert('至少保留一行数据！');
            }

            updateJsonPreview();
        }

        // 从表格获取数据并转换为JSON
        function getTableDataAsJson() {
            const table = document.getElementById('dataTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            const headerRow = thead.querySelector('tr');
            const dataRows = tbody.querySelectorAll('tr');

            if (!headerRow || dataRows.length === 0) {
                return null;
            }

            // 获取表头字段名
            const fields = [];
            headerRow.querySelectorAll('input').forEach(input => {
                fields.push(input.value.trim() || '未命名字段');
            });

            // 处理数据
            const data = [];
            dataRows.forEach(row => {
                const rowData = {};
                row.querySelectorAll('input').forEach((input, index) => {
                    rowData[fields[index]] = input.value.trim();
                });
                data.push(rowData);
            });

            // 根据模式返回对应格式
            if (dataMode === 'single') {
                return data.length > 0 ? data[0] : {};
            } else {
                return data;
            }
        }

        // 更新JSON预览
        function updateJsonPreview() {
            const jsonPreview = document.getElementById('jsonPreview');
            const data = getTableDataAsJson();
            if (data) {
                jsonPreview.textContent = JSON.stringify(data, null, 2);
            } else {
                jsonPreview.textContent = '请输入数据';
            }
        }

        // 表单提交函数
        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            // 检查是否有PDF文件
            if (pdfUrls.length === 0) {
                alert('没有可用的PDF文件，请检查URL参数');
                return;
            }

            // 获取表格数据
            const parsedData = getTableDataAsJson();
            if (!parsedData) {
                alert('请输入有效的填充数据！');
                return;
            }

            // 显示加载状态
            submitBtn.disabled = true;
            loading.classList.add('show');
            resultSection.classList.add('show');
            resultContent.innerHTML = '';

            // 重置进度条
            progressBar.style.width = '0%';
            progressText.textContent = '准备中...';

            try {
                // 根据模式构建请求
                progressText.textContent = '构建请求中...';
                let requestData = {};
                let apiEndpoint = '/api/fill-pdf';

                switch (dataMode) {
                    case 'single':
                        // 单份数据，多个PDF
                        if (typeof parsedData !== 'object' || Array.isArray(parsedData)) {
                            throw new Error('单份数据模式需要JSON对象，而不是数组');
                        }
                        requestData = {
                            urls: pdfUrls,
                            data: parsedData,
                        };
                        progressBar.style.width = '50%';
                        break;

                    case 'multiple':
                        // 多份数据，生成多个PDF
                        if (!Array.isArray(parsedData)) {
                            throw new Error('多份数据模式需要JSON数组');
                        }
                        requestData = {
                            data: parsedData,
                            url: pdfUrls[0], // 使用第一个PDF模板
                        };
                        progressBar.style.width = '50%';
                        break;

                    case 'match':
                        // 一对一匹配
                        if (!Array.isArray(parsedData)) {
                            throw new Error('一对一匹配模式需要JSON数组');
                        }
                        if (parsedData.length !== pdfUrls.length) {
                            throw new Error(`数据条数(${parsedData.length})与PDF数量(${pdfUrls.length})不匹配`);
                        }

                        // 使用批量任务接口
                        apiEndpoint = '/api/fill-pdf-batch';
                        const tasks = parsedData.map((dataItem, index) => ({
                            url: pdfUrls[index],
                            replacements: dataItem,
                        }));

                        requestData = {
                            data: tasks
                        };
                        progressBar.style.width = '60%';
                        break;
                }

                console.log('发送请求到:', apiEndpoint, requestData);
                progressText.textContent = '发送请求中...';

                // 发送请求
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                progressBar.style.width = '80%';
                progressText.textContent = '处理响应中...';

                const result = await response.json();
                console.log('收到响应:', result);

                progressBar.style.width = '100%';
                progressText.textContent = '处理完成！';

                // 显示结果
                showResult(result);

            } catch (error) {
                console.error('请求失败:', error);
                resultContent.className = 'result-content error';
                resultContent.innerHTML = `
                    <div class="result-title">⚠️ 请求失败</div>
                    <p>错误信息：${error.message}</p>
                    <p>请检查输入数据格式和网络连接。</p>
                `;
            } finally {
                // 恢复按钮状态
                setTimeout(() => {
                    submitBtn.disabled = false;
                    loading.classList.remove('show');
                    progressBar.style.width = '0%';
                }, 1000);
            }
        }

        // 显示结果
        function showResult(result) {
            const resultContent = document.getElementById('resultContent');

            if (result.code === 200) {
                resultContent.className = 'result-content';

                if (dataMode === 'match' || pdfUrls.length > 1) {
                    // 显示批量结果
                    showBatchResult(result, resultContent);
                } else {
                    // 显示单文件结果
                    showSingleResult(result, resultContent);
                }
            } else {
                resultContent.className = 'result-content error';
                resultContent.innerHTML = `
                    <div class="result-title">❌ 处理失败</div>
                    <p>错误信息：${result.message}</p>
                    ${result.data && result.data.errors ?
                        `<div class="batch-info">错误详情：${JSON.stringify(result.data.errors)}</div>` : ''}
                `;
            }
        }

        // 显示单文件结果
        function showSingleResult(result, container) {
            const files = result.data.files || [result.data];
            let html = `
                <div class="result-title">✅ PDF生成成功</div>
                <p>成功生成 ${files.length} 个PDF文件</p>
            `;

            files.forEach((file, index) => {
                html += `
                    <div class="batch-result-item success">
                        <div class="result-index">${index + 1}</div>
                        <strong>${file.filename || '生成文件'}</strong>
                        <div class="pdf-url">${file.processed_url}</div>
                        <div class="action-buttons">
                            <button onclick="window.open('${file.processed_url}', '_blank')">
                                📄 打开PDF
                            </button>
                            <button onclick="copyToClipboard('${file.processed_url}')">
                                📋 复制链接
                            </button>
                        </div>
                        ${file.note ? `<div class="batch-info">${file.note}</div>` : ''}
                    </div>
                `;
            });

            // 如果是批量文件，添加下载全部按钮
            if (files.length > 1) {
                html += `
                    <div style="text-align: center; margin-top: 20px;">
                        <a class="download-all" onclick="downloadAllFiles(${JSON.stringify(files.map(f => f.processed_url))})">
                            📥 下载全部文件
                        </a>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // 显示批量结果
        function showBatchResult(result, container) {
            const results = result.data.results || result.data.files || [];
            const errors = result.data.errors || [];
            const stats = result.data.statistics || { total: results.length, success: 0, failed: errors.length };

            let html = `
                <div class="result-title">📊 批量处理报告</div>
                <p>总计：${stats.total} 个 | 成功：<span style="color: #28a745">${stats.success}</span> 个 | 失败：<span style="color: #dc3545">${stats.failed}</span> 个</p>
            `;

            // 显示成功结果
            <!-- 修改后 -->
            // 确保正确获取API返回的files数组
            const processedFiles = result.data?.files || [];

            processedFiles.forEach((item, index) => {
                // 后端返回的结构中没有success字段，改用是否存在processed_url判断
                if (item.processed_url) {
                    html += `
                        <div class="batch-result-item success">
                            <div class="result-index">${index + 1}</div>
                            <strong>${item.filename || 'PDF文件'}</strong>
                            <div class="pdf-url">${item.processed_url}</div>
                            <div class="action-buttons">
                                <button onclick="window.open('${item.processed_url}', '_blank')">
                                    📄 打开
                                </button>
                                <button onclick="copyToClipboard('${item.processed_url}')">
                                    📋 复制
                                </button>
                            </div>
                            ${item.original_url ? `<div class="batch-info">源文件: ${item.original_url}</div>` : ''}
                        </div>
                    `;
                }
            });

            // 显示错误结果
            if (errors.length > 0) {
                html += `
                    <div class="result-title" style="margin-top: 20px; color: #dc3545;">❌ 失败任务</div>
                `;

                errors.forEach((error, index) => {
                    html += `
                        <div class="batch-result-item error">
                            <div class="result-index">${index + 1}</div>
                            <strong>失败任务 ${error.index + 1}</strong>
                            <div class="pdf-url">${error.url || '未知URL'}</div>
                            <p style="color: #dc3545; margin-top: 5px;">错误：${error.error}</p>
                        </div>
                    `;
                });
            }

            // 添加下载全部按钮
            const successUrls = results.filter(item => item.success).map(item => item.processed_url);
            if (successUrls.length > 0) {
                html += `
                    <div style="text-align: center; margin-top: 20px;">
                        <a class="download-all" onclick="downloadAllFiles(${JSON.stringify(successUrls)})">
                            📥 下载全部成功文件 (${successUrls.length}个)
                        </a>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // 下载全部文件
        function downloadAllFiles(urls) {
            urls.forEach((url, index) => {
                setTimeout(() => {
                    window.open(url, '_blank');
                }, index * 100); // 避免同时打开太多窗口
            });
        }

        // 复制到剪贴板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('链接已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制链接。');
            });
        }
    </script>
</body>
</html>
